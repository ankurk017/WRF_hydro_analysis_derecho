name: Status run start/stop alerts

# Status-side alerts (not PBS). Runs when watch_loop pushes docs/status.json.
# Posts a GitHub Issue comment → GitHub emails you if Issues notifications are on.
on:
  push:
    branches: [main]
    paths:
      - 'docs/status.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with previous commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Diff previous vs current status.json
        id: diff
        run: |
          set -euo pipefail
          PREV_PATH=/tmp/previous_status.json
          if git cat-file -e 'HEAD~1:docs/status.json' 2>/dev/null; then
            git show 'HEAD~1:docs/status.json' > "$PREV_PATH"
          else
            PREV_PATH=/tmp/no_previous_status.json
          fi
          python3 scripts/diff_status_alerts.py \
            "$PREV_PATH" docs/status.json \
            --markdown-out alert.md \
            --json-out alert.json
          if [[ -s alert.md ]]; then
            echo "has_alert=true" >> "$GITHUB_OUTPUT"
            echo "---- alert ----"
            cat alert.md
          else
            echo "has_alert=false" >> "$GITHUB_OUTPUT"
            echo "No start/stop transitions"
          fi

      - name: Find or create alerts issue
        if: steps.diff.outputs.has_alert == 'true'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='Phase-1 run status alerts'
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,title \
            --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1 || true)
          if [[ -z "${NUM}" ]]; then
            URL=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$(cat <<'EOF'
          Automated **start/stop** alerts from `docs/status.json` diffs (GitHub Actions — not PBS job mail).

          To get email: repo **Watch → Custom → Issues** (or participating notifications).

          Dashboard: https://ankurk017.github.io/WRF_hydro_analysis_derecho/
          EOF
          )")
            NUM="${URL##*/}"
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "Using issue #$NUM"

      - name: Comment alert on issue
        if: steps.diff.outputs.has_alert == 'true' && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file alert.md

      # Optional direct SMTP (set repo Variable STATUS_ALERT_EMAIL + Secrets
      # SMTP_SERVER, SMTP_USERNAME, SMTP_PASSWORD; optional SMTP_PORT).
      - name: Optional SMTP email
        if: >-
          steps.diff.outputs.has_alert == 'true'
          && vars.STATUS_ALERT_EMAIL != ''
          && secrets.SMTP_SERVER != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: WRF Phase-1 run start/stop alert
          to: ${{ vars.STATUS_ALERT_EMAIL }}
          from: WRF Hydro status <${{ secrets.SMTP_USERNAME }}>
          body: file://alert.md
          secure: true
